<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" role="presentation">
  <style>
    .pulse { stroke-dasharray: 60 1240; animation: run 5s linear infinite; }
    @keyframes run { from { stroke-dashoffset: 60; } to { stroke-dashoffset: -1240; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>
  <defs>
    <!-- In the picture's own units: a flat line has no box of its own to stretch a gradient over. -->
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" x2="1200">
      <stop offset="0" stop-color="#e8a06a" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#e8a06a" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#6cd8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6cd8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 12H1200" stroke="url(#line)" stroke-width="1.5"/>
  <path class="pulse" d="M0 12H1200" stroke="#6cd8ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="600" cy="12" r="4.5" fill="#0a0d14" stroke="#e8a06a" stroke-width="1.6"/>
</svg>
